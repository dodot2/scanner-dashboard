<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>조건식 검증</title>
<style>
  :root{
    --paper:#F5F6F7; --card:#FFFFFF; --ink:#15181C; --muted:#6B7580; --rule:#E1E5E9;
    --rise:#D22B36; --fall:#1B5BC8; --flat:#8B949E; --warn-bg:#FFF3D1; --warn-ink:#5A4300; --warn-rule:#E8CF86;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0E1114; --card:#161A1F; --ink:#E7EAED; --muted:#8B959F; --rule:#252B32;
      --rise:#F2555F; --fall:#5E94EF; --flat:#78818B; --warn-bg:#2C2610; --warn-ink:#E6CE88; --warn-rule:#4A3F1A;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0E1114; --card:#161A1F; --ink:#E7EAED; --muted:#8B959F; --rule:#252B32;
    --rise:#F2555F; --fall:#5E94EF; --flat:#78818B; --warn-bg:#2C2610; --warn-ink:#E6CE88; --warn-rule:#4A3F1A;
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
    font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
  .wrap{max-width:980px;margin:0 auto;padding:30px 20px 90px}
  h1{font-size:19px;font-weight:650;margin:0 0 4px;letter-spacing:-.01em}
  h2{font-size:15.5px;font-weight:630;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 26px}
  .note{color:var(--muted);font-size:13px;margin:0 0 14px;max-width:70ch}
  section{margin-bottom:42px}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:20px}
  .banner{padding:9px 20px;font-size:13px;text-align:center;background:var(--warn-bg);color:var(--warn-ink);border-bottom:1px solid var(--warn-rule)}
  .warns{margin:0 0 24px;padding:12px 16px;border:1px solid var(--warn-rule);background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;font-size:13.5px}
  .warns div+div{margin-top:4px}
  .up{color:var(--rise)}.down{color:var(--fall)}.zero{color:var(--flat)}
  .muted{color:var(--muted)}

  /* 판정 */
  .verdict{padding:26px 24px}
  .verdict .head{font-size:23px;font-weight:640;letter-spacing:-.02em;line-height:1.35;margin:0 0 6px}
  .verdict .why{color:var(--muted);font-size:13.5px;margin:0 0 22px;max-width:68ch}
  .meter{display:grid;grid-template-columns:90px 1fr 120px;gap:12px;align-items:center;margin-bottom:9px;font-size:13px}
  .meter .t{height:8px;border-radius:4px;background:var(--rule);overflow:hidden}
  .meter .f{height:100%;background:var(--ink)}
  .meter .n{text-align:right;color:var(--muted)}
  .vs{display:flex;gap:44px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--rule)}
  .vs .k{font-size:12.5px;color:var(--muted)}
  .vs .v{font-size:22px;font-weight:600;letter-spacing:-.01em}
  .vs .m{font-size:12.5px;color:var(--muted)}
  .two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));margin-top:14px}
  .two .card h3{font-size:13.5px;font-weight:600;margin:0 0 4px}
  .two .card p{margin:0;font-size:13.5px}

  /* 표 */
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--rule);word-break:keep-all;overflow-wrap:anywhere}
  th{font-weight:550;color:var(--muted);font-size:12.5px}
  th:first-child,td:first-child{text-align:left}
  tbody tr:last-child td{border-bottom:none}
  td.l,th.l{text-align:left}

  /* 막대 */
  .bar{display:grid;grid-template-columns:92px 1fr 218px;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px}
  .bar .lbl{color:var(--muted)}
  .bar .track{height:15px;background:var(--rule);border-radius:3px;overflow:hidden;position:relative}
  .bar .fill{display:block;height:100%;background:var(--flat)}
  .bar .fill.good{background:var(--rise)}.bar .fill.bad{background:var(--fall)}
  .bar.dim{opacity:.5}
  .bar .val{text-align:right;color:var(--muted)}.bar .val b{color:var(--ink);font-weight:580}
  .fun{display:grid;grid-template-columns:150px 1fr 120px;align-items:center;gap:10px;margin-bottom:8px;font-size:13px}
  .fun .track{height:18px;background:var(--rule);border-radius:3px;overflow:hidden}
  .fun .fill{display:block;height:100%;background:var(--ink)}
  .fun .val{text-align:right;color:var(--muted)}.fun .val b{color:var(--ink)}

  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .tabs button{font:inherit;font-size:13px;padding:5px 13px;border:1px solid var(--rule);background:var(--card);color:var(--muted);border-radius:999px;cursor:pointer}
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .tabs button:focus-visible,.copy button:focus-visible{outline:2px solid var(--fall);outline-offset:2px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
  .grid h3{font-size:13.5px;font-weight:580;margin:0 0 12px}
  svg{display:block;width:100%;height:auto}
  .legend{display:flex;gap:18px;font-size:12.5px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
  .legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px}
  .copy{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
  .copy input{flex:1 1 160px;min-width:0;font:inherit;font-size:12.5px;padding:7px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink)}
  .copy button{font:inherit;font-size:13px;padding:7px 14px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:6px;cursor:pointer}
  .empty{text-align:center;padding:56px 20px;color:var(--muted)}.empty p{margin:0 0 6px}
  .bdg{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;border:1px solid var(--rule);color:var(--muted)}
  .bdg.go{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .bdg.no{text-decoration:line-through}
  svg.spark{display:inline-block;width:110px;height:26px;vertical-align:middle}
  pre.yaml{margin:10px 0;padding:10px 12px;background:var(--paper);border:1px solid var(--rule);border-radius:6px;font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere}
  .lab small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
  .rowchamp td{background:color-mix(in srgb,var(--rule) 35%,transparent)}
  [hidden]{display:none!important}
  /* 탭 */
  .tabbar{position:sticky;top:0;z-index:5;display:flex;gap:4px;margin:0 0 24px;padding:8px 0;background:var(--paper);border-bottom:1px solid var(--rule)}
  .tabbar [role=tab]{flex:1 1 0;min-width:0;font:inherit;font-size:14px;font-weight:560;padding:8px 2px;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
  .tabbar [role=tab][aria-selected=true]{background:var(--ink);color:var(--paper)}
  .tabbar [role=tab]:focus-visible{outline:2px solid var(--fall);outline-offset:2px}
  [role=tabpanel]:focus{outline:none}
  /* 반응형 표: 핵심 열 + 행을 누르면 펼침 */
  .card.tbl{padding:6px 16px}
  .cv{min-width:0;overflow-wrap:anywhere}
  .rtab.ex tr.rr{cursor:pointer}
  .rtab.ex tr.rr:hover td{background:color-mix(in srgb,var(--rule) 30%,transparent)}
  .rtab.ex tr.rr>td:first-child::before{content:"▸";display:inline-block;width:1.1em;color:var(--muted)}
  .rtab.ex tr.rr[aria-expanded=true]>td:first-child::before{content:"▾"}
  .rtab.ex tr.rr:focus-visible{outline:2px solid var(--fall);outline-offset:-2px}
  .rtab tr.xrow>td{background:var(--paper);text-align:left}
  .hint{margin:6px 0 4px;font-size:12px;color:var(--muted)}
  dl.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:2px 22px;margin:0}
  dl.kv>div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:4px 0;border-bottom:1px dashed var(--rule);min-width:0}
  dl.kv dt{color:var(--muted);font-size:12.5px;flex:0 0 auto}
  dl.kv dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}
  .sub2{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
  .h2s{font-weight:400;font-size:13px}
  .h3s{font-size:14px;font-weight:600;margin:26px 0 4px}
  /* 후보 카드 */
  .cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
  .cc{padding:16px 18px;min-width:0}
  .cc header{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:16px}
  .cc .cm{margin:2px 0 12px;font-size:12.5px;color:var(--muted)}
  dl.kv2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;margin:0;font-size:14px}
  dl.kv2 dt{color:var(--muted)}
  dl.kv2 dd{margin:0;text-align:right;font-weight:560;min-width:0;overflow-wrap:anywhere}
  ul.sum{list-style:none;margin:0;padding:14px 18px}
  ul.sum li+li{margin-top:8px;padding-top:8px;border-top:1px solid var(--rule)}
  ul.sum b{margin-right:6px}
  ul.res{list-style:none;margin:0;padding:0}
  ul.res li{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--rule)}
  ul.res li:last-child{border-bottom:0}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--rule);border-radius:999px;font-size:13px}
  ol.mini{margin:0;padding-left:20px} ol.mini li{padding:4px 0;border-bottom:1px solid var(--rule)} ol.mini li:last-child{border:0}
  ol.mini li span:first-child{font-weight:560;margin-right:8px}
  .ch{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .cc header .bdg{margin-left:auto}
  /* 막대 카드가 좁으면 세로로 */
  .cq{container-type:inline-size;min-width:0}
  @container (max-width:430px){
    .bar{grid-template-columns:minmax(0,1fr) auto;row-gap:3px}
    .bar .track{grid-column:1/-1;order:3}
  }
  @media (max-width:720px){
    .card.tbl{padding:0;border:0;background:transparent}
    .rtab thead{display:none}
    .rtab,.rtab tbody,.rtab tr,.rtab td{display:block;width:100%}
    .rtab tr.rr{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:8px 14px;margin-top:10px}
    .rtab tr.rr td,.rtab tr.rr td.l{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:5px 0;border:0;text-align:right}
    .rtab tr.rr td::before,.rtab.ex tr.rr>td:first-child::before,.rtab.ex tr.rr[aria-expanded=true]>td:first-child::before{content:attr(data-label);display:block;width:auto;color:var(--muted);font-size:12.5px;text-align:left;flex:0 0 auto;max-width:42%}
    .rtab tr.rr td>.cv{text-align:right}
    .rtab.ex tr.rr::after{content:"더 보기 ▾";display:block;text-align:right;font-size:12px;color:var(--muted);padding-top:4px}
    .rtab.ex tr.rr[aria-expanded=true]::after{content:"접기 ▴"}
    .rtab tr.xrow{border:1px solid var(--rule);border-top:0;border-radius:0 0 10px 10px;margin-top:-8px;padding:8px 14px;background:var(--paper)}
    .rtab tr.xrow>td{padding:0;border:0}
    .rowchamp td{background:transparent}
    .rtab tr.rowchamp{border-color:var(--ink)}
    .hint{display:none}
  }  @media (max-width:560px){
    .wrap{padding:22px 14px 70px}
    .bar{grid-template-columns:1fr auto;row-gap:3px}
    .bar .track{grid-column:1/-1;order:3}
    .fun{grid-template-columns:92px 1fr 88px}
    .meter{grid-template-columns:52px 1fr 78px}
    .verdict{padding:20px 16px}.verdict .head{font-size:20px}
    .vs{gap:22px}
  }
</style>
</head>
<body>
<div class="banner" id="sample" hidden></div>
<div class="wrap" id="app"><div class="empty"><p>불러오는 중</p></div></div>

<script>
const nz = v => v===null||v===undefined||v===""||(typeof v==="number"&&!isFinite(v));
const W = n => nz(n) ? "—" : Math.round(Number(n)).toLocaleString("ko-KR");
const P = (n,d=2) => nz(n) ? "—" : (n>0?"+":n<0?"−":"") + Math.abs(Number(n)).toFixed(d) + "%";
const WON = n => nz(n) ? "—" : (n>0?"+":n<0?"−":"") + W(Math.abs(n)) + "원";
const cls = n => nz(n)||n===0 ? "zero" : n>0 ? "up" : "down";
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ds = d => `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`;
const md = d => `${d.slice(4,6)}/${d.slice(6,8)}`;
const PP = n => nz(n) ? "—" : (n>0?"+":n<0?"−":"") + Math.abs(Number(n)).toFixed(2);
const PP3 = n => nz(n) ? "—" : (n>0?"+":n<0?"−":"") + Math.abs(Number(n)).toFixed(3);
const T = v => nz(v) ? "—" : v;
const NAME = {a:"기존 방식", b:"새 방식", c:"5일 홀딩"};
const TABS = [["today","오늘"],["closebet","종가배팅"],["perf","성적"],["lab","연구실"],["log","기록"]];
const LABEL={gapfail:"갭상 후 밀림 제한",basic:"기본 자격",trend252:"52주 고점 근접",trend20:"20일 고점 근접",volume:"거래량 급증",bullish:"양봉",tail:"윗꼬리 짧음",change:"등락률 범위"};
const yamlOf = set => { const g={}; Object.entries(set).forEach(([k,v])=>{const [a,b]=k.split("."); (g[a]=g[a]||[]).push(`  ${b}: ${v}`);}); return Object.entries(g).map(([a,l])=>`${a}:\n${l.join("\n")}`).join("\n"); };
const fmtV = v => (typeof v==="number" && Math.abs(v)>=1e8) ? (v/1e8).toLocaleString("ko-KR")+"억" : v;
const setText = set => Object.entries(set).map(([k,v])=>k.split(".")[1]+" "+fmtV(v)).join(", ");
let D=null, scen="b";
let tab = (location.hash||"").slice(1); if(!TABS.some(t=>t[0]===tab)) tab="today";

/* 반응형 표: core 열만 보이고 나머지는 행을 누르면 펼친다. 좁은 화면(720px 미만)에서는 행이 카드로 바뀐다. */
function rtable(cols, rows, o={}){
  if(!rows||!rows.length) return "";
  const core=cols.filter(c=>c.core!==false), more=cols.filter(c=>c.core===false), ex=more.length>0;
  const td=(c,r,i)=>`<td class="${c.l?"l ":""}${c.c?c.c(r,i):""}" data-label="${esc(c.h)}"><span class="cv">${c.v(r,i)}</span></td>`;
  return `<div class="card tbl"><table class="rtab${ex?" ex":""}"><thead><tr>${core.map(c=>`<th${c.l?' class="l"':""}>${esc(c.h)}</th>`).join("")}</tr></thead><tbody>${rows.map((r,i)=>
    `<tr class="rr${o.rowCls?" "+o.rowCls(r,i):""}"${ex?' tabindex="0" aria-expanded="false"':""}>${core.map(c=>td(c,r,i)).join("")}</tr>`+
    (ex?`<tr class="xrow" hidden><td colspan="${core.length}"><dl class="kv">${more.map(c=>`<div><dt>${esc(c.h)}</dt><dd class="${c.c?c.c(r,i):""}">${c.v(r,i)}</dd></div>`).join("")}</dl></td></tr>`:"")).join("")}</tbody></table>${ex?`<p class="hint">행을 누르면 나머지 항목이 펼쳐집니다.</p>`:""}</div>`;
}
const sec = (title, body, note) => `<section><h2>${title}</h2>${note?`<p class="note">${note}</p>`:""}${body}</section>`;
const emptyCard = (...lines) => `<div class="card empty">${lines.map(l=>`<p>${l}</p>`).join("")}</div>`;
/* ───── 선별 효과 판정 ───── */
function verdictText(v){
  if(v.state==="insufficient") return {head:"아직 판단할 수 없습니다", why:`조건식이 종목을 잘 고르는지 가리려면 후보와 대조군이 각각 ${v.need}건 이상 필요합니다. 그 전의 차이는 우연일 수 있습니다.`};
  if(v.state==="pass") return {head:"후보가 대조군보다 유의하게 높습니다", why:`같은 규칙(시가 매수→종가 매도)으로 매매했을 때 평균 수익률 차이가 ${P(v.diff)}p이고 통계적으로 유의합니다(t=${v.t}). 임계값을 바꿔 여러 번 시험했다면 이 결과도 과대평가일 수 있습니다.`};
  if(v.state==="fail") return {head:"후보가 대조군보다 유의하게 낮습니다", why:`평균 수익률 차이 ${P(v.diff)}p(t=${v.t}). 지금 조건식은 종목 선별에 도움이 되지 않습니다. 조건을 다시 설계해야 합니다.`};
  return {head:"후보와 대조군의 차이가 유의하지 않습니다", why:`표본은 충분하지만 평균 수익률 차이 ${P(v.diff)}p는 우연 범위 안입니다(t=${v.t}). 지금 조건식이 필터로서 효과가 있다는 증거가 없습니다.`};
}
function verdictBlock(){
  const v = D.verdict; if(!v) return "";
  const pc = Math.min(100, v.n_cand/v.need*100), pk = Math.min(100, v.n_ctrl/v.need*100);
  const {head, why} = verdictText(v), pr = D.paired, sc = D.config;
  return `<div class="card verdict">
    <p class="head">${head}</p><p class="why">${why}</p>
    <div class="meter"><span>후보</span><span class="t"><span class="f" style="width:${pc}%;display:block"></span></span><span class="n">${v.n_cand} / ${v.need}건</span></div>
    <div class="meter"><span>대조군</span><span class="t"><span class="f" style="width:${pk}%;display:block"></span></span><span class="n">${v.n_ctrl} / ${v.need}건</span></div>
    <div class="vs">
      <div><div class="k">후보 평균 (시가→종가)</div><div class="v ${cls(v.cand_avg)}">${P(v.cand_avg)}</div><div class="m">승률 ${nz(v.cand_win)?"—":v.cand_win+"%"}</div></div>
      <div><div class="k">대조군 평균</div><div class="v ${cls(v.ctrl_avg)}">${P(v.ctrl_avg)}</div><div class="m">승률 ${nz(v.ctrl_win)?"—":v.ctrl_win+"%"}</div></div>
      <div><div class="k">B가 진입한 종목만 비교</div><div class="v"><span class="${cls(pr.a_avg)}">${P(pr.a_avg)}</span> <span class="muted">→</span> <span class="${cls(pr.b_avg)}">${P(pr.b_avg)}</span></div><div class="m">기존 → 새 방식 · ${pr.n}건</div></div>
    </div>
  </div>
  <div class="two">
    <div class="card"><h3>① 선별 효과</h3><p class="muted">필터를 통과한 후보와, 통과하지 못한 무작위 종목을 같은 규칙으로 매매해 비교합니다. 조건식이 먹히는지는 여기서 판단합니다.</p></div>
    <div class="card"><h3>② 진입 규칙 효과</h3><p class="muted">같은 종목에 시가 매수(기존)와 첫 5분봉 돌파 매수(새 방식)를 적용해 비교합니다. 비용 ${sc.cost}%·슬리피지 ${sc.slip}%를 반영한 값입니다.</p></div>
  </div>`;
}

function candCards(){
  const t = D.today;
  if(!t) return sec("최근 후보", emptyCard("아직 후보가 없습니다."));
  const codes = t.rows.map(r=>r.code).join(",");
  const head = t.settled ? "평가 완료" : "평가 대기 — 다음 거래일 장 마감 후 반영";
  const fix = `<span class="muted">09:05 확정</span>`;
  const card = r => {
    const range = nz(r.open_lo) ? "—" : (r.open_lo>r.open_hi ? "없음(호가단위)" : `${W(r.open_lo)}~${W(r.open_hi)}`);
    const st = t.settled
      ? `기존 <span class="${cls(r.a_ret)}">${P(r.a_ret)}</span> · 새 <span class="${cls(r.b_ret)}">${nz(r.b_ret)?esc(r.b_exit||"—"):P(r.b_ret)+" "+esc(r.b_exit||"")}</span>`
      : `대기 <span class="muted">(첫 5분봉 09:05 확정)</span>`;
    const kv = [["기준가", W(r.ref_price)], ["진입 허용 시가", range], ["프리마켓 제외선", nz(r.pre_excl)?"—":W(r.pre_excl)+"↑"],
      ["매수 기준선", nz(r.buy_line)?fix:W(r.buy_line)], ["손절선", nz(r.stop_line)?fix:W(r.stop_line)],
      ["익절 목표", nz(t.tp)?"—":"+"+t.tp+"%"], ["상태", st]];
    return `<article class="card cc"><header><b>${esc(r.name)}</b><span class="muted">${esc(r.code)}</span></header>
      <p class="cm">점수 ${nz(r.score)?"—":Number(r.score).toFixed(1)} · 등락 <span class="${cls(r.change)}">${P(r.change,1)}</span> · 거래량 ×${(r.vol_ratio/100).toFixed(1)} · 52주고점 ${P(r.gap252,1)}${r.gap_fail>=2?` · <span class="down">밀림 ${r.gap_fail}회</span>`:""}</p>
      <dl class="kv2">${kv.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></article>`;
  };
  return `<section><h2>아침 단타 후보 · ${ds(t.date)}</h2><p class="note">${head}. 기준가는 선정일 종가이고, 다음 거래일 시가가 '진입 허용 시가' 안(갭 ${t.gap?t.gap[0]+"~"+t.gap[1]:"—"}%, 호가단위 반영)이면 새 방식 진입 대상입니다. 프리마켓에서 제외선(+3%) 이상이면 제외합니다. 매수 기준선과 손절선은 09:05에 첫 5분봉이 끝나야 정해집니다.</p>
    ${t.rows.length?`<div class="cards">${t.rows.map(card).join("")}</div>`:emptyCard("조건을 통과한 종목이 없습니다.")}
    <p class="note" style="margin-top:14px">관심종목에는 아래 코드를 그대로 붙여넣으면 됩니다.</p>
    <div class="copy"><input id="codes" readonly value="${esc(codes)}" aria-label="종목코드"><button id="copyBtn">복사</button></div></section>`;
}
function oneLiners(){
  const v = D.verdict, items = [];
  if(v){ const {head}=verdictText(v);
    items.push(`<li><b>선별 효과</b> ${head} <span class="muted">${v.state==="insufficient"?`(후보 ${v.n_cand}/${v.need}건 · 대조군 ${v.n_ctrl}/${v.need}건)`:`(차이 ${P(v.diff)}p, t=${v.t})`}</span></li>`);
  } else items.push(`<li><b>선별 효과</b> 아직 평가된 거래가 없어 판단할 수 없습니다</li>`);
  const B = D.b_backtest;
  if(B && B.summary){ const s=B.summary.all;
    items.push(`<li><b>B 과거 백테스트</b> ${B.window.days}일 후보 ${W(s.n)}건 중 진입 ${W(s.entered)}건(${T(s.entry_rate)}%) · 승률 ${T(s.win)}% · 같은 종목 A 대비 <span class="${cls(s.delta)}">${PP(s.delta)}%p</span> <span class="muted">(t=${T(s.t)})</span></li>`);
  }
  return sec("한눈에", `<ul class="sum card">${items.join("")}</ul>`);
}
function prevResult(){
  if(!D.has_trades || !D.recent || !D.recent.length) return "";
  const last = D.recent.map(r=>String(r.date)).sort().pop();
  const rows = D.recent.filter(r=>String(r.date)===last);
  return sec(`전날 후보 결과 · ${ds(last)}`, `<div class="card"><ul class="res">${rows.map(r=>`<li><span>${esc(r.name)}</span><span>기존 <b class="${cls(r.a_ret)}">${P(r.a_ret)}</b> · 새 ${r.b_entered?`<b class="${cls(r.b_ret)}">${P(r.b_ret)}</b> `:""}<span class="muted">${esc(r.b_exit||"")}</span></span></li>`).join("")}</ul></div>`,
    "선정 다음 거래일 가격으로 가상 매매한 결과입니다(비용 반영).");
}
function warnBlock(){ return D.warnings&&D.warnings.length ? `<div class="warns" role="alert">${D.warnings.map(w=>`<div>${esc(w)}</div>`).join("")}</div>` : ""; }
/* ───── 성적 ───── */
function chart(daily){
  const w=900,h=250,pl=64,pr=12,pt=14,pb=26;
  const all = daily.flatMap(d=>["a","b","c"].map(s=>d[s].cum));
  let lo=Math.min(0,...all), hi=Math.max(0,...all); if(hi===lo) hi=lo+1;
  const pad=(hi-lo)*.1; lo-=pad; hi+=pad;
  const X=i=>pl+(w-pl-pr)*(daily.length<2?.5:i/(daily.length-1));
  const Y=v=>pt+(h-pt-pb)*(1-(v-lo)/(hi-lo));
  const col={a:"var(--flat)",b:"var(--rise)",c:"var(--fall)"}, dash={a:"4 3",b:"",c:"2 3"};
  let g=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="누적 손익 추이">`;
  for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4,y=Y(v);
    g+=`<line x1="${pl}" y1="${y}" x2="${w-pr}" y2="${y}" stroke="var(--rule)"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${(Math.round(v/10000)||0).toLocaleString("ko-KR")}만</text>`;}
  if(lo<0&&hi>0) g+=`<line x1="${pl}" y1="${Y(0)}" x2="${w-pr}" y2="${Y(0)}" stroke="var(--muted)"/>`;
  for(const s of ["a","c","b"]){
    if(daily.length===1){ g+=`<circle cx="${X(0)}" cy="${Y(daily[0][s].cum)}" r="4" fill="${col[s]}"/>`; continue; }
    g+=`<polyline points="${daily.map((d,i)=>`${X(i)},${Y(d[s].cum)}`).join(" ")}" fill="none" stroke="${col[s]}" stroke-width="${s==="b"?2.4:1.5}" stroke-dasharray="${dash[s]}" stroke-linejoin="round"/>`;}
  const step=Math.max(1,Math.ceil(daily.length/8));
  daily.forEach((d,i)=>{ if(i%step&&i!==daily.length-1)return;
    g+=`<text x="${X(i)}" y="${h-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${md(d.date)}</text>`;});
  return g+"</svg>";
}
function summaryTable(){
  const s=D.summary, c=D.ctrl, rows=[["새 방식 (후보)",s.b,"진입 기록 없음"],["기존 방식 (후보)",s.a],["5일 홀딩 (후보)",s.c,`${D.config.hold}거래일이 지나야 확정됩니다`]];
  if(c) rows.push(["기존 방식 (대조군)",c.a],["5일 홀딩 (대조군)",c.c,"대기 중"]);
  const has = r => r[1]&&r[1].n, x = r => r[1]||{};
  return rtable([
    {h:"방식", l:true, v:r=>r[0]},
    {h:"건수", v:r=>has(r)?x(r).n+"건":`<span class="muted">${r[2]||"기록 없음"}</span>`},
    {h:"승률", v:r=>has(r)?x(r).win+"%":"—"},
    {h:"평균", v:r=>P(x(r).avg), c:r=>cls(x(r).avg)},
    {h:"누적 손익", v:r=>has(r)?WON(x(r).pnl):"—", c:r=>cls(x(r).pnl)},
    {h:"손익비", core:false, v:r=>x(r).pf??"—"},
    {h:"최고", core:false, v:r=>P(x(r).best), c:()=>"up"},
    {h:"최저", core:false, v:r=>P(x(r).worst), c:()=>"down"},
  ], rows);
}
function funnelBlock(){
  const f=D.funnel; if(!f.total) return "";
  const rows=[["후보",f.total,f.total],["갭 범위 통과",f.gap_ok,f.total],["돌파 진입",f.entered,f.gap_ok],
    ["　익절",f.tp,f.entered],["　손절",f.stop,f.entered],["　09:30 청산",f.timed,f.entered]];
  return rows.map(([l,n,base])=>`<div class="fun"><span>${l}</span><span class="track"><span class="fill" style="width:${base?n/f.total*100:0}%"></span></span><span class="val"><b>${n}건</b>${base&&l!=="후보"?` · ${(n/base*100).toFixed(0)}%`:""}</span></div>`).join("")
   + `<p class="note" style="margin-top:12px">갭 범위(${D.config.gap[0]}~${D.config.gap[1]}%)를 벗어나거나 09:15까지 돌파하지 못해 매매하지 않은 후보가 ${f.total-f.entered}건입니다. 이 단계의 이탈이 크면 갭 범위나 돌파 조건을 검토할 근거가 됩니다.${f.no_data?` <b class="down">5분봉을 받지 못한 건 ${f.no_data}건</b>은 새 방식 성적에서 빠져 있습니다.`:""}</p>`;
}
function dailyTable(){
  return rtable([
    {h:"날짜", l:true, v:d=>ds(d.date)}, {h:"후보", v:d=>d.candidates},
    {h:"새 손익", v:d=>WON(d.b.pnl), c:d=>cls(d.b.pnl)}, {h:"기존 손익", v:d=>WON(d.a.pnl), c:d=>cls(d.a.pnl)},
    {h:"새 진입", core:false, v:d=>d.b.n}, {h:"새 누적", core:false, v:d=>WON(d.b.cum), c:d=>cls(d.b.cum)},
    {h:"기존 누적", core:false, v:d=>WON(d.a.cum), c:d=>cls(d.a.cum)},
  ], [...D.daily].reverse());
}
function perfTab(){
  if(!D.has_trades) return emptyCard("아직 평가된 거래가 없습니다.","첫 후보의 결과는 다음 거래일 장 마감 후 스캔 때 반영됩니다.");
  const s=D.summary, diff=(s.b.pnl||0)-(s.a.pnl||0), last=D.daily[D.daily.length-1];
  return sec("누적 손익", `<div class="card">${chart(D.daily)}<div class="legend"><span><i style="background:var(--rise)"></i>새 방식</span><span><i style="background:var(--flat)"></i>기존 방식</span><span><i style="background:var(--fall)"></i>5일 홀딩</span></div></div>`,
      `후보 종목만 집계합니다. 5일 홀딩은 선정일 기준으로 ${D.config.hold}거래일 뒤에 확정되므로 최근 구간은 비어 있습니다. 새 방식과 기존 방식의 누적 차이는 <b class="${cls(diff)}">${WON(diff)}</b>, 최대 낙폭은 새 방식 ${WON(last.b.mdd)} / 기존 방식 ${WON(last.a.mdd)}입니다.`)
    + sec("방식별 성적", summaryTable(), `모든 수익률은 거래비용 ${D.config.cost}%와 슬리피지 ${D.config.slip}%를 뺀 값입니다.`)
    + sec("새 방식 매매 퍼널", `<div class="card">${funnelBlock()}</div>`, "후보가 실제 매매로 이어지기까지 어디서 빠지는지 보여줍니다.")
    + sec("일별 기록", dailyTable());
}
/* ───── 연구실 ───── */
function spark(a){
  if(!a||a.length<2) return "";
  const w=110,h=26, lo=Math.min(0,...a), hi=Math.max(0,...a), r=(hi-lo)||1;
  const X=i=>i/(a.length-1)*w, Y=v=>h-2-(h-4)*((v-lo)/r);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="누적 초과수익 추이"><line x1="0" x2="${w}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--rule)"/><polyline points="${a.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ")}" fill="none" stroke="${a[a.length-1]>=0?"var(--rise)":"var(--fall)"}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
function variantsSec(R){
  const w=R.window, V=R.variants;
  const tbl = rtable([
    {h:"조건", l:true, v:(x,i)=>`${esc(x.name)}${i?`<small class="sub2">${esc(setText(x.set))}</small>`:""}`},
    {h:"상태", l:true, v:(x,i)=>`<span class="bdg ${(i===0?(x.state==="likely"||x.state==="promote"):x.proposable)?"go":(x.state==="reject"||x.state==="worse")?"no":""}">${esc(x.status)}</span>`},
    {h:"후보/일", v:x=>T(x.per_day)},
    {h:"표본 밖 초과 (t)", v:x=>`${PP(x.a.oos.excess)} <span class="muted">(${T(x.a.oos.t)})</span>`, c:x=>cls(x.a.oos.excess)},
    {h:"현재 대비 표본 밖 (t)", v:(x,i)=>i&&x.vs? PP(x.vs.oos.delta)+` <span class="muted">(${T(x.vs.oos.t)})</span>`:"기준", c:(x,i)=>i?cls(x.vs&&x.vs.oos.delta):"zero"},
    {h:"평균", core:false, v:x=>P(x.a.avg), c:x=>cls(x.a.avg)},
    {h:"초과 %p (t)", core:false, v:x=>`${PP(x.a.all.excess)} <span class="muted">(${T(x.a.all.t)})</span>`, c:x=>cls(x.a.all.excess)},
    {h:"표본 안 t", core:false, v:x=>T(x.a.is.t)},
    {h:"전방", core:false, v:x=>x.a.fwd.days? `${x.a.fwd.days}일 <span class="${cls(x.a.fwd.excess)}">${PP(x.a.fwd.excess)}</span>`:"—"},
    {h:"손익분기 비용", core:false, v:x=>nz(x.a.breakeven)?"—":x.a.breakeven.toFixed(2)+"%"},
    {h:"일평균 손익", core:false, v:x=>WON(x.a.pnl_day), c:x=>cls(x.a.pnl_day)},
    {h:"누적 초과", core:false, v:x=>spark(x.cum)||"—"},
  ], V, {rowCls:(x,i)=>i===0?"rowchamp":""});
  return sec("조건식 연구실", tbl + `<p class="note" style="margin-top:12px">변종이 ${R.K}개라 우연히 좋아 보일 확률을 막으려고 표본 안 판정 기준을 |t|≥${R.z_star}로 올렸습니다(유의수준 ${R.alpha}를 Bonferroni 보정). 이 기준은 근사치이며, 우위 없는 가짜 데이터 24종으로 점검했을 때 발견은 0건이었습니다. <b>세 번째 관문인 전방 검증이 실질적인 확인입니다.</b> 손익분기 비용은 이 값을 넘는 거래비용에서는 평균 수익이 사라진다는 뜻입니다.</p>`,
    `현재 설정과 변종 ${V.length-1}개를 같은 데이터로 매일 다시 백테스트합니다. 기간은 ${ds(w.start)}~${ds(w.end)}(${w.days}일)이고, 앞 ${w.is_days}일에서 고르고 뒤 ${w.oos_days}일(${ds(w.oos_start)}~)은 판정에만 씁니다. 초과수익은 같은 날 기본 자격을 갖춘 전 종목 평균(${PP(R.universe_avg)}%)을 뺀 값이라 장 전체가 오른 날의 착시를 제거합니다. 시가 매수→종가 매도 기준이며 거래비용 ${R.assumptions.cost}%·슬리피지 ${R.assumptions.slip}%가 반영돼 있습니다.`);
}
function proposalSec(R){
  const hot=R.variants.slice(1).filter(x=>x.proposable);
  const body = hot.length
    ? hot.map(x=>`<div class="card" style="margin-bottom:12px"><b>${esc(x.name)}</b> <span class="bdg go">${esc(x.status)}</span>
        <pre class="yaml">${esc(yamlOf(x.set))}</pre>
        <p class="muted" style="margin:0;font-size:13.5px">표본 밖 초과수익 ${PP(x.a.oos.excess)}%p, 현재 설정 대비 ${PP(x.vs.oos.delta)}%p(짝지은 t=${x.vs.oos.t}), 전방 검증 ${x.a.fwd.days}/${R.rules.forward_min_days}일. 적용하려면 <code>config.yaml</code>의 해당 값을 위처럼 바꾸세요. 바꾸면 설정 버전이 달라져 이후 성적이 새로 집계됩니다.${x.state==="likely"?" 전방 검증이 끝나기 전에는 승격하지 않는 것을 권합니다.":""}</p></div>`).join("")
    : `<div class="card"><p style="margin:0"><b>지금은 바꿀 근거가 있는 변경이 없습니다. 현재 설정을 유지하세요.</b></p><p class="muted" style="margin:6px 0 0;font-size:13.5px">변경을 제안하려면 모두 넘어야 합니다. ① 표본 안에서 보정된 기준(|t|≥${R.z_star})을 넘고 ② 표본 밖에서도 양(+)으로 유의하며 ③ <b>현재 설정보다 같은 날끼리 짝지어 비교해도 표본 안·밖 모두 낫고, 표본 밖에서 보정된 기준(t≥${R.z_vs})을 넘을 것</b>. 승격은 여기에 ④ 등록 이후 전방 ${R.rules.forward_min_days}일 이상 우위 유지가 더해져야 합니다. 변종들은 같은 종목을 공유해서 전부 '시장보다 낫다'고 나오기 쉬워, ③이 없으면 현재 설정보다 못한 변경도 제안하게 됩니다.</p></div>`;
  return sec("제안", body);
}
function regimeSec(R){
  const rg=R.variants[0].regime;
  return sec(`어떤 장세에서 먹히는가 <span class="muted h2s">현재 설정 · 초과수익 %p</span>`,
    rtable([{h:"장세", l:true, v:k=>({down:"하락장",flat:"보합장",up:"상승장"})[k]},
            {h:"초과수익", v:k=>PP(rg[k].excess), c:k=>cls(rg[k].excess)}, {h:"일수", v:k=>rg[k].days+"일"}], ["down","flat","up"]),

function entrySec(R){
  const er=R&&R.entry_rules;

    ? `<p class="note">저장된 5분봉 ${er.n_rows}건으로 진입 규칙을 한 값씩만 바꿔 다시 시뮬레이션합니다. '후보당 기대수익'은 진입하지 않은 후보를 0으로 두고 평균한 값이라 진입 건수가 다른 규칙끼리 공정하게 비교됩니다.</p>${gridTable(er.rules)}`
    : `<p class="note">아직 전방(실운영)으로 저장된 5분봉이 없습니다. 매 거래일 후보 종목의 5분봉을 저장하고 있어, 쌓이면 이 표에서 규칙을 비교합니다. 과거 구간은 키움 5분봉을 소급해 받은 위 'B 과거 백테스트'에서 먼저 확인할 수 있습니다(2025-10-15까지 소급 확인).</p>`;
  return sec(`진입 규칙 연구 <span class="muted h2s">아침 돌파 방식(B) · 전방 기록</span>`, body);
}function bBacktestSec(){
  const B=D.b_backtest; if(!B||!B.summary) return "";
  const w=B.window, a=B.assumptions, S=B.summary;
  const tbl = rtable([
    {h:"구간", l:true, v:k=>({all:"전체",is:"표본 안",oos:"표본 밖"})[k]},
    {h:"후보", v:k=>W(S[k].n)},
    {h:"진입 (진입률)", v:k=>`${W(S[k].entered)} <span class="muted">(${nz(S[k].entry_rate)?"—":S[k].entry_rate+"%"})</span>`},
    {h:"승률", v:k=>nz(S[k].win)?"—":S[k].win+"%"},
    {h:"B−A (t)", v:k=>`${nz(S[k].delta)?"—":PP(S[k].delta)+"%p"} <span class="muted">(${T(S[k].t)})</span>`, c:k=>cls(S[k].delta)},
    {h:"B 진입 평균", core:false, v:k=>P(S[k].b_avg), c:k=>cls(S[k].b_avg)},

  ], ["all","is","oos"], {rowCls:k=>k==="all"?"rowchamp":""});
  const ex=Object.entries(B.exits||{}).map(([k,v])=>`${esc(k)} ${W(v)}`).join(" · ");
  const eg=B.entry_grid;
  const grid = eg && eg.n_rows>0 ? `<h3 class="h3s">진입 규칙 그리드 <span class="muted">과거 분봉 ${W(eg.n_rows)}건 · 기준 |t|≥${eg.z_star}</span></h3>
    <p class="note">현재 규칙에서 한 값씩만 바꿔 같은 과거 분봉으로 다시 계산했습니다. '후보당 기대수익'은 진입하지 않은 후보를 0으로 둔 평균입니다. 여러 규칙을 비교했기 때문에 기준을 |t|≥${eg.z_star}로 올렸습니다.</p>${gridTable(eg.rules)}` : "";
  return sec(`B 과거 백테스트 <span class="muted h2s">키움 5분봉 소급 · ${esc(B.generated||"")} 기준</span>`,
    tbl + `<p class="note" style="margin-top:12px">B−A는 B가 진입한 종목만 같은 종목의 A와 짝지어 뺀 값입니다. 후보당 B−A는 B가 진입하지 않은 후보를 0(현금)으로, A는 모든 후보를 매수한 것으로 보고 비교합니다. 청산 사유: ${ex}.</p>
    <p class="note">이 결과는 키움이 연결된 PC에서만 갱신되고, 매일 자동 실행(공개 데이터)은 이 표를 지우지 않고 그대로 보여줍니다. 실운영 전방 기록(가상매매 성적)과는 섞지 않습니다. 과거 고가·저가·거래량에는 애프터마켓 체결이 섞였을 수 있습니다.</p>${grid}`,

}
function labTab(){

  if(R && R.error) h += sec("조건식 연구실", emptyCard(esc(R.error)));

const CBL = {B:"종가_B", A:"A", D:"D(대덕전자형)", B10:"B(상위10%판)"};
const CBN = {B:"주력 · 20일 +20%↑ · 당일 +3%↑ · 양봉 · 고가 대비 −2% 이내", A:"비교 · 등락 +6~10% · 거래량 3배↑ · 거래대금 100억↑", D:"비교 · 20일 상위10% · 전일 +5% 양봉 → 당일 음봉 −1.5~−6%"};
function swBadge(s){ if(!s) return `<span class="bdg">—</span>`; return `<span class="bdg ${s.on?"go":""}">${s.on?"ON":"OFF"}</span>`; }
function lineChart(series, opt={}){
  const pts = series.flatMap(s=>s.points.map(p=>p[1])); if(!pts.length) return "";
  const dates = [...new Set(series.flatMap(s=>s.points.map(p=>p[0])))].sort();
  const w=900,h=220,pl=56,pr=12,pt=12,pb=24; let lo=Math.min(0,...pts), hi=Math.max(0,...pts); if(hi===lo) hi=lo+1;
  const pad=(hi-lo)*.08; lo-=pad; hi+=pad;
  const X=d=>pl+(w-pl-pr)*(dates.length<2?.5:dates.indexOf(d)/(dates.length-1)), Y=v=>pt+(h-pt-pb)*(1-(v-lo)/(hi-lo));
  let g=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(opt.label||"누적 추이")}">`;
  for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4,y=Y(v); g+=`<line x1="${pl}" y1="${y}" x2="${w-pr}" y2="${y}" stroke="var(--rule)"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${opt.fmt?opt.fmt(v):v.toFixed(0)}</text>`;}
  if(lo<0&&hi>0) g+=`<line x1="${pl}" y1="${Y(0)}" x2="${w-pr}" y2="${Y(0)}" stroke="var(--muted)"/>`;
  for(const s of series){ if(!s.points.length) continue;
    g+= s.points.length===1 ? `<circle cx="${X(s.points[0][0])}" cy="${Y(s.points[0][1])}" r="4" fill="${s.color}"/>`
      : `<polyline points="${s.points.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ")}" fill="none" stroke="${s.color}" stroke-width="${s.wide?2.4:1.5}" stroke-dasharray="${s.dash||""}" stroke-linejoin="round"/>`; }
  const step=Math.max(1,Math.ceil(dates.length/7));
  dates.forEach((d,i)=>{ if(i%step&&i!==dates.length-1) return; g+=`<text x="${X(d)}" y="${h-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${md(d)}</text>`; });
  return g+`</svg><div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join("")}</div>`;
}

function cbTab(){

  const st=C.state, sw=st.switches, bt=C.backtest;
  const cards = ["B","A","D"].map(r=>{ const s=sw[r]||{};
    return `<article class="card cc"><header><b>${CBL[r]}</b>${swBadge(s)}</header><p class="cm">${CBN[r]}</p>
      <dl class="kv2"><dt>직전 ${s.n||0}회 평균</dt><dd class="${cls(s.avg)}">${P(s.avg)}</dd><dt>오늘 해당</dt><dd>${st.counts[r]}종목</dd><dt>추이</dt><dd>${spark(s.spark)||"—"}</dd></dl></article>`;}).join("");
  let h = sec("규칙별 스위치", `<div class="cards">${cards}</div>`, `직전 ${st.window}회(거래가 있었던 날의 상위 5 바스켓, 익일 시가 청산, 비용 후) 평균이 0보다 크면 ON입니다. 백테스트로 초기값을 채웠고 실제 가상 정산이 쌓이면 그 값으로 바뀝니다. OFF여도 가상 기록은 계속합니다.`);
  h += sec(`오늘 해당 종목 · ${ds(st.date)}`, ["B","A","D"].map(r=>{ const rows=st.today.filter(x=>x.rule===r);
      return `<h3 class="h3s">${CBL[r]} <span class="muted">${st.counts[r]}종목 중 상위 ${rows.length}</span></h3>` + (rows.length?cbPicksTable(rows):`<p class="note">해당 없음</p>`); }).join(""),
    "당일 종가(+슬리피지)로 종목당 같은 금액을 가상 매수합니다. 청산은 다음 거래일 ① 시가 ② 09:10 ③ +3% 익절·−2% 손절·09:30 ④ 종가 네 가지로 기록합니다.");
  h += cbPrevBlock(st.prev, "전일 결과");
  const led = C.ledger && C.ledger.rules;
  if(led && Object.keys(led).length){
    const ser = Object.entries(led).map(([r,x])=>({label:CBL[r]||r, color:CBC[r]||"var(--ink)", wide:r==="B", points:x.daily.map(d=>[d.date,d.cum])}));
    h += sec("규칙별 누적 가상 손익", `<div class="card">${lineChart(ser,{label:"규칙별 누적 가상 손익", fmt:v=>(Math.round(v/10000)).toLocaleString("ko-KR")+"만"})}</div>`, "종목당 100만원 동일 금액, 익일 시가 청산 기준 누적입니다.");
    h += sec("월별 가상 성과", rtable([
      {h:"월·규칙", l:true, v:x=>`${x.month.slice(0,4)}.${x.month.slice(4)} ${CBL[x.rule]||x.rule}`}, {h:"건수", v:x=>x.n}, {h:"① 시가", v:x=>P(x.r_open), c:x=>cls(x.r_open)}, {h:"승률", v:x=>x.win+"%"},
      {h:"④ 종가", core:false, v:x=>P(x.r_close), c:x=>cls(x.r_close)}, {h:"거래일", core:false, v:x=>x.days},
    ], Object.entries(led).flatMap(([r,x])=>x.monthly.map(m=>({...m, rule:r}))).sort((a,b)=>b.month.localeCompare(a.month))));
  } else h += sec("규칙별 누적 가상 손익", emptyCard("아직 정산된 가상 거래가 없습니다.","다음 거래일 장 마감 후 첫 정산이 기록됩니다. 아래 백테스트 누적을 참고하세요."));
  if(bt && bt.rules){
    const ser = ["B","A","D"].filter(r=>bt.rules[r]).map(r=>{ let c=0; return {label:CBL[r], color:CBC[r], wide:r==="B", points:bt.rules[r].series.map(([d,v])=>[d,(c+=v)])}; });
    h += sec(`백테스트 누적(%p 합) <span class="muted h2s">${ds(bt.window.start)}~${ds(bt.window.end)}</span>`, `<div class="card">${lineChart(ser,{label:"백테스트 누적 수익", fmt:v=>v.toFixed(0)+"%"})}</div>`,
      "과거 240일 동안 매일 상위 5를 종가에 사서 다음 날 시가에 판 바스켓 평균 수익(비용 후)을 단순 합산했습니다. 스위치와 무관한 전체 기록입니다.");
    h += sec("월별 백테스트", rtable([
      {h:"월", l:true, v:x=>`${x.month.slice(0,4)}.${x.month.slice(4)}`},
      ...["B","A","D"].map(r=>({h:CBL[r], v:x=>{const m=(bt.rules[r].monthly||[]).find(y=>y.month===x.month); return m?`${P(m.mean)} <span class="muted">(${m.days}일)</span>`:"—";}, c:x=>{const m=(bt.rules[r].monthly||[]).find(y=>y.month===x.month); return m?cls(m.mean):"";}})),
      ...["B","A","D"].map(r=>({h:CBL[r]+" 스위치 ON", core:false, v:x=>{const m=(bt.rules[r].monthly||[]).find(y=>y.month===x.month); return m&&m.on_days?`${P(m.on_mean)} (${m.on_days}일)`:"—";}})),
    ], [...new Set(Object.values(bt.rules).flatMap(x=>(x.monthly||[]).map(m=>m.month)))].sort().reverse().map(m=>({month:m}))), "월마다 해당 규칙 상위 5 바스켓의 일평균(익일 시가 청산, 비용 후)입니다.");
  }
  h += realCompare();
  return h;
}
function realCompare(){
  const R=D.real_trades; if(!R||!R.rows||!R.rows.length) return "";
  const led=D.closebet&&D.closebet.ledger&&D.closebet.ledger.rules;
  const vB = led&&led.B ? `${P(led.B.avg.r_open)} (${led.B.n}건)` : "—";
  const bb = D.b_backtest&&D.b_backtest.summary&&D.b_backtest.summary.all;
  return sec("실매매 비교", rtable([
    {h:"날짜·종목", l:true, v:r=>`${esc(r.date)} ${esc(r.name)}`}, {h:"전략", l:true, v:r=>esc(r.strategy)},
    {h:"평단", v:r=>W(r.avg_price||r.buy_price)}, {h:"결과", v:r=>r.status==="매도"?P(r.ret_pct):`<span class="muted">${esc(r.status)}</span>`, c:r=>cls(r.ret_pct)},
    {h:"매수가·시각", core:false, v:r=>`${W(r.buy_price)} ${esc(r.buy_time||"")}`}, {h:"매도가·시각", core:false, v:r=>nz(r.sell_price)?"—":`${W(r.sell_price)} ${esc(r.sell_time||"")}`},
    {h:"메모", core:false, v:r=>esc(r.memo||"")},
  ], R.rows), `실제 매매(직접 기록)와 가상 기록을 나란히 봅니다. 가상 평균: 종가배팅 종가_B ① 시가 청산 ${vB} · 아침 단타 B 과거 백테스트 진입 평균 ${bb?P(bb.b_avg):"—"}. 수익률은 비용 ${D.config.cost}% 차감 후입니다.`);
}

/* ───── 연구실 추가 ───── */
function bBeforeAfterSec(){
  const A=D.b_backtest_before, B=D.b_backtest; if(!A||!B||!A.summary||!B.summary) return "";
  const rows=[["수정 전 · 전체",A.summary.all],["수정 후 · 전체",B.summary.all],["수정 전 · 표본 밖",A.summary.oos],["수정 후 · 표본 밖",B.summary.oos]];
  return sec("새 방식(B) 시뮬레이션 수정 전후", rtable([
    {h:"구분", l:true, v:r=>r[0]}, {h:"진입", v:r=>`${W(r[1].entered)} <span class="muted">(${T(r[1].entry_rate)}%)</span>`},
    {h:"승률", v:r=>nz(r[1].win)?"—":r[1].win+"%"}, {h:"진입 평균", v:r=>P(r[1].b_avg), c:r=>cls(r[1].b_avg)},
    {h:"같은 종목 A 대비 (t)", core:false, v:r=>`${PP(r[1].delta)}%p (${T(r[1].t)})`, c:r=>cls(r[1].delta)},
    {h:"후보당 B", core:false, v:r=>P(r[1].ev_b,3), c:r=>cls(r[1].ev_b)},
  ], rows), "수정 전 구현은 봉이 끝나야 알 수 있는 거래량으로 판단하면서 돌파 순간 가격에 체결해 미래정보가 섞였습니다. 2026-10-08부터 '봉 마감 확인 진입'(첫 5분봉 고가 위에서 마감 + 그 봉 거래량 > 첫 봉 → 그 봉 종가 진입, 다음 봉부터 청산)으로 고쳤습니다. 같은 후보·같은 분봉으로 다시 계산한 값입니다.");
}
function cbResearchSec(){
  const bt=D.closebet&&D.closebet.backtest; if(!bt||!bt.rules) return "";
  const rows=[]; ["B","B10","A","D"].forEach(r=>{ const x=bt.rules[r]; if(!x) return;
    [["상위 5","top"],["해당 전부","all"],["상위 5 제외","rest"],["상위 5 + 스위치 ON","switch_on"]].forEach(([nm,k])=>rows.push({rule:r, nm, x:x[k], per:x.per_day}));});
  const b=v=>v&&v.days?`${P(v.mean)} <span class="muted">(t=${T(v.t)}, ${v.days}일)</span>`:"—";
  return sec(`종가배팅 백테스트 <span class="muted h2s">${ds(bt.window.start)}~${ds(bt.window.end)} · 표본 밖 ${ds(bt.window.oos_start)}~</span>`, rtable([
    {h:"규칙·묶음", l:true, v:r=>`${CBL[r.rule]} · ${r.nm}`}, {h:"전체", v:r=>b(r.x.all), c:r=>cls(r.x.all.mean)}, {h:"표본 밖", v:r=>b(r.x.oos), c:r=>cls(r.x.oos.mean)},
    {h:"표본 안", core:false, v:r=>b(r.x.is), c:r=>cls(r.x.is.mean)}, {h:"하루 평균 종목", core:false, v:r=>r.per},
  ], rows), `종가(+슬리피지 ${bt.assumptions.slip}%) 매수 → 다음 거래일 시가 매도, 비용 ${bt.assumptions.cost}% 반영, 날짜별 바스켓 평균을 다시 평균했습니다. 스위치 ON은 직전 ${bt.assumptions.window}회 평균이 0보다 클 때만 산 경우입니다. B(상위10%판)는 20일 수익률 조건을 '전 종목 상위 10%'로 바꾼 연구용 변형입니다.`);
}
function casesSec(){
  const C=D.cases; if(!C||!C.length) return "";
  const f=x=>nz(x)?"—":x;
  const body=C.map(cs=>{
    let inner="";
    if(cs.type==="stock") inner=(cs.stocks||[]).map(s=>{
      if(s.error) return `<p class="note">${esc(s.name)}: ${esc(s.error)}</p>`;
      const r=s.result;
      return `<h3 class="h3s">${esc(s.name)} <span class="muted">${esc(s.code)}</span></h3><dl class="kv">
        <div><dt>전일 등락·캔들</dt><dd class="${cls(s.chg_d1)}">${P(s.chg_d1,1)} ${esc(s.candle_d1)}</dd></div>
        <div><dt>전전일 등락·캔들</dt><dd class="${cls(s.chg_d2)}">${P(s.chg_d2,1)} ${esc(s.candle_d2)}</dd></div>
        <div><dt>전일 거래량(전전일 대비)</dt><dd>×${f(s.vol_vs_prev_d1)}</dd></div><div><dt>전일 거래량(20일 평균 대비)</dt><dd>×${f(s.vol_vs_avg20_d1)}</dd></div>
        <div><dt>5일·20일 수익률</dt><dd>${P(s.ret5,1)} · ${P(s.ret20,1)}</dd></div><div><dt>20일·52주 고점 거리</dt><dd>${P(s.gap_high20,1)} · ${P(s.gap_high252,1)}</dd></div>
        <div><dt>20일 평균 거래대금</dt><dd>${W(s.avgval20_eok)}억</dd></div>
        <div><dt>당일 결과</dt><dd>${r?`갭 <span class="${cls(r.gap)}">${P(r.gap)}</span> · 종가 <span class="${cls(r.chg)}">${P(r.chg)}</span> · 시가→고가 ${P(r.open_to_high)}`:"아직 없음"}</dd></div></dl>`;}).join("");
    else if(cs.type==="closebet_preview"){
      const a=cs.actual, n=cs.next;
      inner=`<dl class="kv"><div><dt>장중 미리보기</dt><dd>${f(cs.preview_count)}종목 · ${(cs.preview_top||[]).map(esc).join(", ")}</dd></div>
        <div><dt>실제 종가 기준</dt><dd>${a?`${a.n_qualified}종목 · `+a.top.map(x=>esc(x.name)+" "+P(x.change,1)).join(", "):"아직 없음(16:30 실행 후)"}</dd></div>
        <div><dt>다음 거래일 성과</dt><dd>${n?`${ds(n.d1)} 시가 청산 평균 <span class="${cls(n.avg_open)}">${P(n.avg_open)}</span> · 종가 청산 <span class="${cls(n.avg_close)}">${P(n.avg_close)}</span> (${n.nights}일 보유)`:"정산 대기"}</dd></div></dl>`;
    }
    return `<article class="card" style="margin-bottom:12px"><header class="ch"><b>${esc(cs.title||"")}</b> <span class="muted">${ds(cs.date)}</span></header>
      ${cs.memo?`<p class="note" style="margin:6px 0">${esc(cs.memo)}</p>`:""}${inner}${cs.lesson?`<p style="margin:10px 0 0"><b>교훈</b> ${esc(cs.lesson)}</p>`:""}</article>`;}).join("");
  return sec("사례 노트", body, "사람이 적은 메모와 함께 전날 특징(사례일 전 거래일까지 값)과 당일 결과를 자동으로 계산했습니다.");
}
function realTradesSec(){
  const R=D.real_trades; if(!R||!R.rows||!R.rows.length) return "";
  return sec("실매매 기록", rtable([
    {h:"날짜", l:true, v:r=>esc(r.date)}, {h:"종목", l:true, v:r=>`${esc(r.name)} <span class="muted">${esc(r.code)}</span>`},
    {h:"전략", l:true, v:r=>esc(r.strategy)}, {h:"결과", v:r=>r.status==="매도"?P(r.ret_pct):`<span class="muted">${esc(r.status)}</span>`, c:r=>cls(r.ret_pct)},
    {h:"매수가", core:false, v:r=>W(r.buy_price)}, {h:"평단", core:false, v:r=>W(r.avg_price)}, {h:"수량", core:false, v:r=>nz(r.qty)?"—":W(r.qty)},
    {h:"매도", core:false, v:r=>nz(r.sell_price)?"—":`${W(r.sell_price)} ${esc(r.sell_date||"")} ${esc(r.sell_time||"")}`}, {h:"메모", core:false, v:r=>esc(r.memo||"")},
  ], R.rows), "채팅으로 알려주시면 src/log_trade.py로 기록합니다. 수익률은 평단 기준, 비용 차감 후입니다.");
}
/* ───── 화면 ───── */
function render(){
  const app=document.getElementById("app");
  if(!D||D.empty){
    app.innerHTML=`<h1>조건식 검증</h1><p class="sub">후보 종목을 가상으로 매매해 조건이 실제로 먹히는지 확인합니다.</p><div class="card empty"><p>아직 기록이 없습니다.</p><p>스캐너가 처음 돌고 나면 후보가, 다음 거래일 장 마감 후에 평가 결과가 쌓입니다.</p></div>`;
    return;
  }
  const panels = {today: warnBlock()+candCards()+cbSummary()+oneLiners()+prevResult()+cbPrevBlock(D.closebet&&D.closebet.state&&D.closebet.state.prev, "전일 종가배팅 결과"),
    closebet: cbTab(), perf: perfTab(), lab: labTab(), log: logTab()+realTradesSec()};
  app.innerHTML = `<h1>조건식 검증</h1><p class="sub">${D.has_trades?`${D.days}거래일 · 후보 ${W(D.total)}건 · `:""}종목당 ${W(D.config.unit)}원 가정 · 최근 스캔 ${D.last_scan?ds(D.last_scan):"—"}${D.last_settle?` · 최근 정산 ${ds(D.last_settle)}`:""}</p>
    <nav class="tabbar" role="tablist" aria-label="대시보드 탭">${TABS.map(([id,nm])=>`<button role="tab" id="t-${id}" aria-controls="p-${id}" aria-selected="${tab===id}" tabindex="${tab===id?0:-1}">${nm}</button>`).join("")}</nav>
    ${TABS.map(([id])=>`<div role="tabpanel" id="p-${id}" aria-labelledby="t-${id}" tabindex="0"${tab===id?"":" hidden"}>${panels[id]}</div>`).join("")}`;
  wire();
}
function selectTab(id, focus){
  if(!TABS.some(t=>t[0]===id)) id="today";
  tab=id;
  document.querySelectorAll('[role="tab"]').forEach(b=>{const on=b.id==="t-"+id; b.setAttribute("aria-selected",on); b.tabIndex=on?0:-1; if(on&&focus) b.focus();});
  document.querySelectorAll('[role="tabpanel"]').forEach(p=>p.hidden = p.id!=="p-"+id);
  if(location.hash!=="#"+id) history.replaceState(null,"","#"+id);
}
function wire(){
  const tabs=[...document.querySelectorAll('[role="tab"]')];
  tabs.forEach((b,i)=>{
    b.onclick=()=>selectTab(b.id.slice(2), false);
    b.onkeydown=e=>{const k={ArrowRight:i+1,ArrowLeft:i-1,Home:0,End:tabs.length-1}[e.key]; if(k===undefined) return;
      e.preventDefault(); selectTab(tabs[(k+tabs.length)%tabs.length].id.slice(2), true);};
  });
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{scen=b.dataset.t;render();});
  const btn=document.getElementById("copyBtn"); if(!btn) return;
  btn.onclick=async()=>{const i=document.getElementById("codes");
    try{await navigator.clipboard.writeText(i.value);btn.textContent="복사됨";}
    catch(e){i.select();document.execCommand&&document.execCommand("copy");btn.textContent="선택됨 — Ctrl+C";}
    setTimeout(()=>btn.textContent="복사",1800);};
}
document.addEventListener("click", e=>{const a=e.target.closest("[data-goto]"); if(a){e.preventDefault(); selectTab(a.dataset.goto,false); window.scrollTo(0,0);}});
function toggleRow(tr){
  const d=tr.nextElementSibling; if(!d||!d.classList.contains("xrow")) return;
  const open=d.hidden; d.hidden=!open; tr.setAttribute("aria-expanded", open);
}
document.addEventListener("click", e=>{const tr=e.target.closest(".rtab.ex tr.rr"); if(tr) toggleRow(tr);});
document.addEventListener("keydown", e=>{const tr=e.target.closest&&e.target.closest(".rtab.ex tr.rr"); if(tr&&(e.key==="Enter"||e.key===" ")){e.preventDefault(); toggleRow(tr);}});
window.addEventListener("hashchange", ()=>{ const id=location.hash.slice(1); if(id!==tab) selectTab(id,false); });

if(window.__SAMPLE__){const b=document.getElementById("sample");b.hidden=false;b.textContent=window.__SAMPLE_NOTE__||"샘플 화면입니다. 가격은 난수로 만든 가짜 데이터라 숫자 자체에 의미가 없습니다.";}
(window.__DATA__ ? Promise.resolve(window.__DATA__) : fetch("data.json",{cache:"no-store"}).then(r=>r.json()))
  .then(d=>{D=d;render();}).catch(()=>{D={empty:true};render();});</script>
